name: Publicar imagen en Docker Hub

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit


      - name: Escaner de Seguridad
        run: bandit -r . -s B101

      - name: Ejecutar las pruebas
        run: pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: andresmancera/sample-api:v1


      - name: Escanear contenedor con tryvy
        uses: aquasecurity/trivy-action@master
        with:
          imagen-ref: 'andresmancera/sample-api:v1'
          format: 'table'
          exit-code: '1' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' #son los que van a detener la ejecucion

      - name: Subir la imagen a Docker Hub
        run: docker push andresmancera/sample-api:v1

      - name: Desplegar el servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/DockerFlaskDesplegado
            docker compose pull app-backend
            docker compose up -d