services:
  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-backend
    networks:
      - red-ejemplo-082

  db:
    image: mysql:8.0
    container_name: servidor-bd-082
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-ejemplo-082

  app-backend:
    image: andresmancera/sample-api:v1
    container_name: backend-082
    restart: always
    depends_on:
      - db
    ports:
      - "5050:5050"
    networks:
      - red-ejemplo-082

volumes:
  mysql-data:

networks:
  red-ejemplo-082:server {
    listen 80;
    server_name  localhost;

    location / {
        proxy_pass http://app-backend:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

